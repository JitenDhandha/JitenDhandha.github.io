<html>

{% include head.html %}

<body>
    <script type="text/javascript">document.body.classList.add("is-loading");</script>

    {% include header.html %} 
	<section id="banner" class="style{{page.tile_num | module: 6}}">
		<div class="inner">
			<span class="image">
				<img src="{{ site.baseurl }}/{{ page.image }}" alt="">
			</span>
			<header class="major">
				<h1>{{ page.title }}</h1>
			</header>
            <div class="content">
                <p style="text-transform: uppercase;">{{ page.description }}</p>
            </div>
		</div>
	</section>

	<!-- Main -->
	<div id="main" class="alt">

		<section id="one">
			<div class="inner">
				{% if page.add_toc %}
				<div class="post-layout">
					<aside id="post-toc-sidebar" class="post-toc" aria-label="On this page">
						<h3>On this page</h3>
						<ul id="post-toc"></ul>
					</aside>
					<div class="post-content">
						{{ content }}
					</div>
				</div>
				{% else %}
					{{ content }}
				{% endif %}
			</div>
		</section>
	
	</div>
	
	{% include footer.html %}

</body>

</html>
